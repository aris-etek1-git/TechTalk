
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TechTalk</title>
      <meta name="description" content="Discover an endless scroll of curated tech articles and videos tailored for students and developers to stay updated and engaged effortlessly." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f4fb" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06070c" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("teachtalk_theme");
            var dark = stored ? stored === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.classList.toggle("dark", dark);
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
          } catch (e) {}
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
