
  <!DOCTYPE html>
  <html lang="fr">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TechTalk — Le contenu tech réuni dans un seul flux</title>
      <meta name="description" content="TechTalk agrège vidéos, articles, posts et exercices tech pour les étudiants et développeurs, dans un fil personnalisé." />
      <meta name="robots" content="index, follow" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="TechTalk" />
      <meta property="og:title" content="TechTalk — Le contenu tech réuni dans un seul flux" />
      <meta property="og:description" content="Vidéos, articles, exercices et opportunités depuis YouTube, Reddit, Dev.to et GitHub." />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0c" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("teachtalk_theme");
            var dark = stored ? stored === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.classList.toggle("dark", dark);
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
          } catch (e) {}
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
