
  <!DOCTYPE html>
  <html lang="fr">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TechTalk — Actualités tech, dev et IA agrégées</title>
      <meta name="description" content="TechTalk agrège vidéos, articles et posts tech pour les étudiants et développeurs : IA, web, systèmes, DevOps, cybersécurité. Un fil personnalisé, des shorts et des vidéos longues." />
      <meta name="robots" content="index, follow" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="TechTalk" />
      <meta property="og:title" content="TechTalk — Actualités tech, dev et IA agrégées" />
      <meta property="og:description" content="Un fil de contenu tech personnalisé, agrégé depuis YouTube, Reddit, Dev.to et TechCrunch." />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2fa" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05040a" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("teachtalk_theme");
            var dark = stored ? stored === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.classList.toggle("dark", dark);
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
          } catch (e) {}
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
